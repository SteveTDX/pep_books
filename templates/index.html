<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人教数字教材下载器 · {{ category }}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef1f5; color: #1f2937;
  }
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 220px 12px 20px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
    border-bottom: 1px solid #e5e7eb;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .sub { color: #6b7280; font-size: 12px; white-space: nowrap; }
  #select-all-btn {
    padding: 7px 18px; border: 1px solid #d1d5db; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px; color: #374151;
  }
  #select-all-btn:hover { background: #f3f4f6; }

  /* 悬浮在页面窗体右上角的下载按钮 */
  #download-btn {
    position: fixed; top: 14px; right: 20px; z-index: 100;
    padding: 9px 24px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; font-size: 15px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(37,99,235,.35);
  }
  #download-btn:hover { filter: brightness(1.08); }
  #download-btn:disabled { opacity: .55; cursor: not-allowed; }

  /* 滑块验证提示横幅 */
  #verify-banner {
    display: none; position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    z-index: 200; padding: 10px 22px; border-radius: 10px;
    background: #fff7e6; border: 1px solid #fbbf24; color: #92400e;
    font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }

  main { max-width: 780px; margin: 26px auto 80px; padding: 0 16px; }
  ul.books { list-style: none; margin: 0; padding: 0; }

  li.book-row {
    position: relative; display: flex; align-items: center; gap: 10px;
    margin: 8px 0; padding: 11px 14px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    overflow: hidden;
  }
  /* 进度底纹：下载阶段蓝色，PDF 阶段绿色；宽度由 JS 控制从左向右生长 */
  li.book-row .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: #3b82f6; opacity: .30;
    transition: width .35s ease;
  }
  li.book-row .bar.green { background: #22c55e; }

  li.book-row input[type=checkbox] {
    width: 16px; height: 16px; accent-color: #2563eb;
    position: relative; z-index: 1; flex: none; cursor: pointer;
  }
  li.book-row label {
    flex: 1; font-size: 15px; cursor: pointer;
    position: relative; z-index: 1;
  }
  li.book-row .status {
    font-size: 12px; color: #374151; white-space: nowrap;
    min-width: 110px; text-align: right; position: relative; z-index: 1;
  }
  li.book-row .status.err { color: #b91c1c; }
  .hint { color: #9ca3af; font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>人教数字教材下载器</h1>
  <span class="sub">{{ category }} · 共 {{ books|length }} 本</span>
  <button id="select-all-btn" type="button">全选</button>
</header>

<button id="download-btn" type="button">⬇ 下载选中</button>
<div id="verify-banner">⚠ 网站反爬验证已触发：请在弹出的浏览器窗口中完成滑块验证，通过后任务自动继续</div>

<main>
  <ul class="books">
    {% for b in books %}
    <li class="book-row" data-title="{{ b.title }}">
      <div class="bar"></div>
      <input type="checkbox" class="book-check">
      <label>{{ b.title }}</label>
      <span class="status"></span>
    </li>
    {% endfor %}
  </ul>
  <p class="hint">勾选书目后点击右上角“下载选中”：程序会打开电子书阅读器逐页翻页下载（每页间隔 1~3 秒随机抖动，请耐心等待）。蓝色底纹为页面 jpg 下载进度，绿色底纹为 PDF 合成进度；若网站弹出滑块验证窗口，请手动完成一次验证。任务进行中：取消勾选排队中的书可将其移出队列，下载中 / 合成中 / 已完成的行勾选锁定不可更改。</p>
</main>

<script>
  const rows = Array.from(document.querySelectorAll('.book-row'));
  const rowByTitle = new Map(rows.map(r => [r.dataset.title, r]));
  const selectAllBtn = document.getElementById('select-all-btn');
  const downloadBtn = document.getElementById('download-btn');
  const verifyBanner = document.getElementById('verify-banner');
  const rowPhase = new Map();   // 书名 -> 当前阶段（wait/download/pdf/done/…）
  let jobRunning = false;       // 是否有下载任务进行中
  let allSelected = false;
  let pollTimer = null;

  /* 任务进行期间，这些阶段中的行勾选状态锁定不可更改 */
  const LOCKED_PHASES = new Set(['download', 'downloaded', 'pdf', 'done']);
  const unlockedBoxes = () =>
    Array.from(document.querySelectorAll('.book-check')).filter(c => !c.disabled);

  async function cancelTitles(titles) {
    try {
      await fetch('/api/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titles }),
      });
      poll();
    } catch (e) { /* 网络抖动忽略 */ }
  }

  function resetRow(row) {
    rowPhase.delete(row.dataset.title);
    const bar = row.querySelector('.bar');
    bar.style.width = '0%';
    bar.classList.remove('green');
    const status = row.querySelector('.status');
    status.textContent = '';
    status.classList.remove('err');
    status.title = '';
    row.querySelector('.book-check').disabled = false;
  }

  function updateSelectAllLabel() {
    const boxes = unlockedBoxes();
    allSelected = boxes.length > 0 && boxes.every(c => c.checked);
    selectAllBtn.textContent = allSelected ? '取消全选' : '全选';
  }

  /* 全选 / 取消全选：只作用于未锁定的行；取消勾选排队中的行 = 自动取消排队 */
  selectAllBtn.addEventListener('click', () => {
    const boxes = unlockedBoxes();
    if (!boxes.length) return;
    const target = !allSelected;
    const toCancel = [];
    boxes.forEach(c => {
      const title = c.closest('.book-row').dataset.title;
      if (!target && c.checked && jobRunning && rowPhase.get(title) === 'wait')
        toCancel.push(title);
      c.checked = target;
    });
    if (toCancel.length) cancelTitles(toCancel);
    updateSelectAllLabel();
  });

  /* 单行勾选变化：取消勾选排队中的行 = 自动取消排队 */
  rows.forEach(row => {
    row.querySelector('.book-check').addEventListener('change', ev => {
      const cb = ev.target;
      if (cb.checked) { updateSelectAllLabel(); return; }
      const title = row.dataset.title;
      if (jobRunning && rowPhase.get(title) === 'wait') {
        cancelTitles([title]);
        resetRow(row);   // 立即恢复未选中/无状态，服务器删除随后生效
      }
      updateSelectAllLabel();
    });
  });

  function statusText(p) {
    if (p.error)      return '✗ 失败';
    if (p.phase === 'done')       return '✓ 完成';
    if (p.phase === 'pdf')        return `PDF ${p.done}/${p.total}`;
    if (p.phase === 'downloaded') return '待合成 PDF';
    if (p.phase === 'download')   return p.total ? `下载 ${p.done}/${p.total}` : '准备下载';
    if (p.phase === 'parse')      return '解析页数…';
    return '排队中';
  }

  function applyProgress(items, running) {
    jobRunning = running;
    let busy = false;
    const present = new Set(items.map(p => p.title));
    for (const row of rows) {           // 不在队列中的行复位（如已取消排队）
      if (!present.has(row.dataset.title)) resetRow(row);
    }
    for (const p of items) {
      const row = rowByTitle.get(p.title);
      if (!row) continue;
      const bar = row.querySelector('.bar');
      const status = row.querySelector('.status');
      rowPhase.set(p.title, p.phase);

      const total = p.total || 0, done = p.done || 0;
      const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;

      if (p.error) {
        bar.style.width = '0%';
        bar.classList.remove('green');
      } else if (p.phase === 'pdf') {
        bar.classList.add('green'); bar.style.width = pct + '%';
      } else if (p.phase === 'done') {
        bar.classList.add('green'); bar.style.width = '100%';
      } else {
        bar.classList.remove('green');
        bar.style.width = (p.phase === 'downloaded') ? '100%' : pct + '%';
      }

      if (p.phase !== 'done' && p.phase !== 'error') busy = true;

      /* 下载中/待合成/合成中/已完成的行，任务期间勾选锁定不可更改 */
      row.querySelector('.book-check').disabled =
        running && LOCKED_PHASES.has(p.phase);

      status.textContent = statusText(p);
      status.classList.toggle('err', !!p.error);
      status.title = p.error || '';
    }
    updateSelectAllLabel();
    return busy;
  }

  async function poll() {
    try {
      const r = await fetch('/api/progress');
      const data = await r.json();
      verifyBanner.style.display = data.verify ? 'block' : 'none';
      const busy = applyProgress(data.items || [], data.running) ||
                   data.running || data.verify;
      if (!busy && pollTimer) {
        clearInterval(pollTimer); pollTimer = null;
        downloadBtn.disabled = false;
        downloadBtn.textContent = '⬇ 下载选中';
      }
    } catch (e) { /* 网络抖动忽略 */ }
  }

  downloadBtn.addEventListener('click', async () => {
    const titles = Array.from(document.querySelectorAll('.book-check:checked'))
      .map(c => c.closest('.book-row').dataset.title);
    if (!titles.length) { alert('请先勾选要下载的书目'); return; }

    downloadBtn.disabled = true;
    downloadBtn.textContent = '下载中…';
    try {
      const r = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titles }),
      });
      const data = await r.json();
      if (!r.ok) {
        alert(data.error || '启动下载失败');
        downloadBtn.disabled = false;
        downloadBtn.textContent = '⬇ 下载选中';
        return;
      }
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 700);
    } catch (e) {
      alert('请求失败：' + e);
      downloadBtn.disabled = false;
      downloadBtn.textContent = '⬇ 下载选中';
    }
  });

  /* 页面刷新后恢复进行中的进度显示 */
  poll();
</script>
</body>
</html>
